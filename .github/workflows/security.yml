name: Security Pipeline

# Secure-by-default CI: SAST + SCA + secrets + container scan + DAST, then a
# single consolidated report and one severity gate.
#
# Design note: every individual scanner runs with "|| true" / exit-code 0 so a
# scanner finding something does NOT abort the job early. The aggregator
# (security/aggregate.py) is the ONE place that decides pass/fail, so the report
# is always produced and every tool always runs.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so secret scanning can see past commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tooling
        run: pip install -r requirements-security.txt

      # ---------- SAST ----------
      - name: Bandit (SAST)
        run: bandit -r . -f json -o bandit.json --exclude ./.git,./venv,./.venv || true

      # ---------- SCA (dependencies) ----------
      - name: pip-audit (SCA)
        run: pip-audit -f json -o pip-audit.json --desc || true

      # ---------- Secrets ----------
      - name: Gitleaks (secrets)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --no-git -f json -r /repo/gitleaks.json --exit-code 0 || true

      # ---------- Container image scan ----------
      # Build the target image, then scan it. Point this at YOUR app's image in a
      # real repo (change the build context / Dockerfile path below).
      - name: Build image for scanning
        run: docker build -t app:ci -f security/demo_app/Dockerfile security/demo_app

      - name: Trivy (container scan)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: app:ci
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"          # never fail here; the aggregator gates

      # ---------- DAST ----------
      # Start the app under test, wait for it, scan it. Swap the start command and
      # URL for your own app in a real repo.
      - name: Start app under test
        run: |
          pip install -r security/demo_app/requirements.txt
          python security/demo_app/app.py &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:5001/ >/dev/null && break
            sleep 1
          done

      - name: DAST scan
        run: python security/dast_scanner.py http://127.0.0.1:5001 -o dast-report.json --delay 0

      # ---------- Aggregate + gate ----------
      - name: Aggregate findings and gate
        run: |
          python security/aggregate.py \
            --bandit bandit.json \
            --pip-audit pip-audit.json \
            --gitleaks gitleaks.json \
            --trivy trivy.json \
            --dast dast-report.json \
            --out-json security-report.json \
            --out-html security-report.html \
            --fail-on HIGH

      - name: Upload reports
        if: always()             # keep the report even when the gate fails the job
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-report.json
            security-report.html
            bandit.json
            pip-audit.json
            gitleaks.json
            trivy.json
            dast-report.json
          retention-days: 14
