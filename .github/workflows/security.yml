name: Security Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tooling
        run: pip install -r requirements-security.txt

      - name: Bandit (SAST)
        run: bandit -r . -f json -o bandit.json --exclude ./.git,./venv,./.venv || true

      - name: pip-audit (SCA)
        run: pip-audit -f json -o pip-audit.json --desc || true

      - name: Gitleaks (secrets)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --no-git -f json -r /repo/gitleaks.json --exit-code 0 || true

      - name: Build image for scanning
        run: docker build -t app:ci -f security/demo_app/Dockerfile security/demo_app

      - name: Trivy (container scan)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: app:ci
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Start app under test
        run: |
          pip install -r security/demo_app/requirements.txt
          python security/demo_app/app.py &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:5001/ >/dev/null && break
            sleep 1
          done

      - name: DAST scan
        run: python security/dast_scanner.py http://127.0.0.1:5001 -o dast-report.json --delay 0

      - name: Aggregate findings and gate
        run: |
          python security/aggregate.py \
            --bandit bandit.json \
            --pip-audit pip-audit.json \
            --gitleaks gitleaks.json \
            --trivy trivy.json \
            --dast dast-report.json \
            --out-json security-report.json \
            --out-html security-report.html \
            --fail-on NONE

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            security-report.json
            security-report.html
            bandit.json
            pip-audit.json
            gitleaks.json
            trivy.json
            dast-report.json
          retention-days: 14
